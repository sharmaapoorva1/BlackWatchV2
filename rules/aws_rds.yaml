# RDS log-based detections. Fed by the aws.rds adapter which parses
# postgresql.log + RDS Proxy log lines forwarded by the bw-rds-forwarder
# Lambda -> SQS -> BW pipeline.
#
# Tag convention: see rules/aws_iam.yaml (notify:critical/high/medium).
# rds.session.start / rds.session.end are informational transitions (they
# populate rds_active_sessions and drive the live-connected UI). Alerting
# lives on auth failures, privileged queries, and posture-like signals.

# ---- Auth failures --------------------------------------------------------

- id: rds-auth-failure
  title: RDS authentication failure
  description: One failed login. Informational -- the burst rule below is what
    escalates when this pattern repeats.
  severity: low
  tags: [rds, auth]
  match:
    field: action
    op: equals
    value: rds.auth.failure

- id: rds-auth-burst
  title: RDS auth failure burst
  description: 5+ failed logins for the same user within 5 minutes -- likely
    a brute-force attempt or a broken service repeatedly retrying with the
    wrong password. Emitted by the projection.
  severity: high
  tags: [rds, auth, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.auth.burst

# ---- Session anomalies ----------------------------------------------------

- id: rds-session-concurrent
  title: RDS session opened from multiple IPs
  description: The same DB user is connected from more than one source IP at
    the same time. Legitimate for pool workers on the same host; suspicious
    when the IPs are on different subnets / networks. Investigate.
  severity: high
  tags: [rds, session, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.session.concurrent

- id: rds-session-long-idle
  title: RDS session idle > 24h
  description: A session has been open more than 24h without a matching
    disconnection. Usually a leaked / forgotten psql window OR an app whose
    connection pool never released this worker. Investigate the source IP.
  severity: medium
  tags: [rds, session, "notify:medium"]
  match:
    field: action
    op: equals
    value: rds.session.long_idle

# ---- Privileged queries (pgaudit) ----------------------------------------

- id: rds-privileged-ddl
  title: RDS privileged DDL executed
  description: DROP / CREATE / ALTER on a production database. pgaudit-decoded.
  severity: critical
  tags: [rds, query, ddl, "notify:critical"]
  match:
    all:
      - field: action
        op: equals
        value: rds.query.ddl
      - field: extra.command
        op: in
        value:
          - DROP TABLE
          - DROP SCHEMA
          - DROP DATABASE
          - DROP INDEX
          - TRUNCATE TABLE
          - ALTER TABLE
          - CREATE TABLE
          - CREATE INDEX
          - CREATE SCHEMA
          - CREATE DATABASE

- id: rds-role-change
  title: RDS role / grant change
  description: GRANT / REVOKE / CREATE USER / ALTER ROLE. Access-management event
    -- every one is either a real permission change or an attacker persistence move.
  severity: critical
  tags: [rds, query, role, "notify:critical"]
  match:
    field: action
    op: equals
    value: rds.query.role

- id: rds-function-executed
  title: RDS function executed
  description: pgaudit fires this for security-definer / plpgsql function calls.
    Informational unless a rule below tightens it.
  severity: medium
  tags: [rds, query, function, "notify:medium"]
  match:
    field: action
    op: equals
    value: rds.query.function

# ---- Engine errors -------------------------------------------------------

- id: rds-fatal-error
  title: RDS FATAL error
  description: PostgreSQL emitted a FATAL / PANIC. Includes OOM, disk full,
    corrupted-catalog conditions.
  severity: high
  tags: [rds, engine, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.error

# ---- Shape B: stolen-credential / new-source detection --------------------

- id: rds-proxy-source-new
  title: New source IP connected to the RDS Proxy
  description: A real client IP that has never been seen before opened a
    connection to the RDS Proxy. Legitimate for new employee laptops, new
    VPN IPs, new AWS pods. Suspicious for compromised VPN certs, ex-employee
    reconnecting, or an attacker with stolen creds trying from unfamiliar
    infrastructure. Emitted once per (source_ip, day) by the projection.
  severity: high
  tags: [rds, session, shape_b, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.proxy.source.new

- id: rds-session-new-source
  title: DB user connected from a new source IP
  description: A known DB user authenticated from a client IP we have never
    seen for them before (only detectable when the proxy session was pinned
    to a backend db conn — non-pinned sessions can't be traced back to a real
    client IP). Strong stolen-credential signal.
  severity: high
  tags: [rds, session, shape_b, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.session.new_source

- id: rds-user-unknown
  title: Unknown DB user authenticated
  description: A DB user that is NOT on the operator-maintained allowlist
    attempted to authenticate (success or failure). Catches ex-employees
    whose creds were not rotated, rogue users created via CloudFormation,
    and typo-squatting. Add legitimate users via the /rds/allowlist API.
    Emitted once per (user, day).
  severity: critical
  tags: [rds, auth, shape_b, "notify:critical"]
  match:
    field: action
    op: equals
    value: rds.user.unknown

# ---- Proxy-side operational issues ---------------------------------------

- id: rds-proxy-backend-hba
  title: RDS Proxy could not reach backend Postgres (pg_hba reject)
  description: The proxy tried to open a backend connection and the backend's
    pg_hba.conf did not list the proxy ENI. Requires a DBA fix on the backend
    postgresql pg_hba.conf. Muted while the DBA sorts it — unmute after fix.
  severity: medium
  tags: [rds, proxy, "notify:medium"]
  match:
    field: action
    op: equals
    value: rds.proxy.backend_hba_reject

# ---- Silent-failure and compromise signals --------------------------------

- id: rds-logs-silent
  title: RDS log feed went quiet
  description: A database that normally logs activity has produced nothing for longer than its own normal gaps (and at least 2h; BLACKWATCH_RDS_SILENT_MINUTES). A broken subscription filter, forwarder, or queue looks exactly like this.
  severity: high
  tags: [rds, availability, silent-failure, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.logs.silent

- id: rds-logs-resumed
  title: RDS log feed resumed
  description: Database activity is arriving again after a silent period. Informational; closes rds-logs-silent.
  severity: informational
  tags: [rds, availability]
  match:
    field: action
    op: equals
    value: rds.logs.resumed

- id: rds-auth-success-after-failures
  title: RDS login succeeded after repeated failures
  description: A human DB user logged in within 10 minutes of 5+ failed attempts. This is what a guessed password looks like. Service accounts are skipped (a rotated password makes an app fail and then succeed).
  severity: high
  tags: [rds, auth, credential-compromise, "notify:high"]
  match:
    field: action
    op: equals
    value: rds.auth.success_after_failures
