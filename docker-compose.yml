services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blackwatch
      POSTGRES_PASSWORD: blackwatch
      POSTGRES_DB: blackwatch
    ports:
      - "5432:5432"
    volumes:
      # DATA SAFETY: this volume is the primary BlackWatch database. Rebuilds
      # and `docker compose up --build` must preserve it. Never run
      # `docker compose down -v` or change this volume without a verified
      # backup and an explicit operator decision.
      - bw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://blackwatch:blackwatch@db:5432/blackwatch
      BLACKWATCH_TOKENS: devtoken:generic,vpntoken:vpn.openvpn,s3token:aws.s3
      BW_UEBA_DB: /app/data/baseline.db
    ports:
      - "8000:8000"
    volumes:
      # Mount operator-editable config so changes only need `restart`, not rebuild.
      - ./rules:/app/rules:ro
      - ./notifications.yaml:/app/notifications.yaml:ro
      # Persist UEBA baseline state outside the application image.
      - ./data/ueba:/app/data
      # Mount your AWS credentials (read-only) for the SQS connectors (CloudTrail /
      # EC2 host agent / OpenVPN agent — all three drain via target_module=…).
      # Reference the profile name in Settings → Connectors. Uncomment & adjust:
      - ${HOME}/.aws/blackwatch-credentials:/root/.aws/credentials:ro
    extra_hosts:
      # Lets the containerized app reach services on your host (e.g. the webhook
      # listener) via http://host.docker.internal:<port>.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./blackwatch-ui
      args:
        # IMPORTANT: Next.js rewrites() runs at BUILD time (standalone output
        # bakes the resolved target into the manifest). Runtime env alone is
        # too late — the fetch would resolve to the fallback. Pass it here.
        BW_API_URL: http://app:8000
    environment:
      # Kept for server-side fetches in Server Components (which use the
      # runtime env via lib/api.ts's API_BASE).
      BW_API_URL: http://app:8000
      # Optional server-side IP intelligence keys. Do not use NEXT_PUBLIC_*
      # names: these must never be bundled into the browser.
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  bw_pgdata:
    # This is the verified production/dev database volume. Pin the physical
    # name so Compose project-directory changes cannot create a new database
    # volume or prompt to adopt the existing one.
    name: blackwatch_bw_pgdata
    external: true
